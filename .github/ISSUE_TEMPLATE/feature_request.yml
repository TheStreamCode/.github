name: Standard change
description: Propose a change to the repository standard or the default community health files.
title: "[Standard]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the proposed rule.
        A rule change applies to every public repository, so state what it costs existing projects.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does the current standard get wrong or leave ambiguous?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed rule
      description: Exact wording or behavior, and the section of STANDARDS.md it belongs to.
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: Impact on existing repositories
      description: Which repositories would need changes, and whether the rule is enforced by CI or review only.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for this proposal.
          required: true
